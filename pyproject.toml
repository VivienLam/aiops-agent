[project]
name = "aiops-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.20",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
aiops-agent = "aiops_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
