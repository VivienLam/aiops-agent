[project]
name = "aiops-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
aiops-agent = "aiops_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
